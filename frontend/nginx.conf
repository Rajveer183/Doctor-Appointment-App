# Static-only. Deliberately no proxy_pass to a "backend" host: vite.config.js proxies
# /api to 127.0.0.1:8000 for local dev, but two Cloud Run services don't share a network
# namespace, so nginx would fail to start trying to resolve that name. In production the
# browser calls the backend URL directly, baked in via VITE_API_URL at build time, and
# the backend's FRONTEND_ORIGIN allows that origin through CORS (step 8).

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Hashed Vite assets are content-addressed, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else falls back to index.html so react-router deep links work.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
